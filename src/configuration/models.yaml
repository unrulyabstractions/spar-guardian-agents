# Every model we can consider for the agents, the LLM controls and the judge, with the name each route needs.
#
# `python -m src models` prints this file as a table; `python -m src run --model <entry>` takes an entry's name
# (or any Inspect model string). `inspect` is the string Inspect's get_model takes. `provider` names the route
# below, which says which variable holds the key, and whose `batch_discount` scales every price of a batch call.
# `cheatbench` lists the entries of submodules/cheatbench/configs/models.yaml that run the same model through
# CheatBench's own harness; every CheatBench entry appears once. `status` is default (the agents' default), judge
# (the judge's default), candidate, or legacy (a newer model of the same provider supersedes it). `usd_per_million`
# is the provider's own list price on `as_of`, in USD per million tokens, unless `price_source` says otherwise.
# Context and output limits are tokens. Mock models (`mockllm/model`) need no entry. An entry may pin its route:
# `model_args` go to Inspect's get_model (OpenRouter's `provider` routing) and `generate` to the agents' generate
# config (reasoning effort, parallel_tool_calls, max_tokens); src/run.py passes both and the eval log records them.

as_of: 2026-10-27

providers:
  deepseek:
    inspect_prefix: deepseek
    key_env: [DEEPSEEK_API_KEY]
    base_url_env: DEEPSEEK_BASE_URL
    base_url: https://api.deepseek.com
    docs: https://api-docs.deepseek.com/quick_start/pricing
    notes: >-
      OpenAI-compatible. Thinking is on by default with effort high; the API takes low, high or max. Inspect maps
      reasoning_effort minimal to low, medium to high and xhigh to max (DeepSeek's own table maps xhigh to high),
      and "none" turns thinking off. A thinking request cannot force a tool choice, and a response schema is sent as
      plain JSON mode. Off-peak hours, all but 01:00-04:00 and 06:00-10:00 UTC on weekdays and every hour of a
      Chinese public holiday, cost half the listed price. No batch API.
  google:
    inspect_prefix: google
    key_env: [GOOGLE_API_KEY, GEMINI_API_KEY]
    base_url_env: GOOGLE_BASE_URL
    batch_discount: 0.5
    docs: https://ai.google.dev/gemini-api/docs/pricing
    notes: >-
      Inspect reads GOOGLE_API_KEY and accepts GEMINI_API_KEY; run.py exports the latter as the former. Output
      prices include thinking tokens. Batch requests cost half.
  openai:
    inspect_prefix: openai
    key_env: [OPENAI_API_KEY]
    base_url_env: OPENAI_BASE_URL
    batch_discount: 0.5
    docs: https://developers.openai.com/api/docs/pricing
    notes: >-
      Batch requests cost half the standard price. A prompt over 272K input tokens is priced at twice the input and
      cache rates and 1.5 times the output rate for the whole request.
  anthropic:
    inspect_prefix: anthropic
    key_env: [ANTHROPIC_API_KEY]
    base_url_env: ANTHROPIC_BASE_URL
    batch_discount: 0.5
    docs: https://platform.claude.com/docs/en/about-claude/pricing
    notes: >-
      Batch requests cost half the standard price. Every current model thinks adaptively; Fable 5.1 and Opus 5.5
      cannot turn thinking off.
  xai:
    inspect_prefix: grok
    key_env: [XAI_API_KEY, GROK_API_KEY]
    base_url_env: XAI_BASE_URL
    docs: https://docs.x.ai/docs/models
    notes: >-
      Prompts of 200k tokens or more cost twice the listed price. Inspect's grok provider imports the xAI SDK
      (xai_sdk, grpc), which .venv lacks; install it or take the OpenRouter route.
  moonshot:
    inspect_prefix: moonshot
    key_env: [MOONSHOT_API_KEY]
    base_url_env: MOONSHOT_BASE_URL
    base_url: https://api.moonshot.ai/v1
    docs: https://platform.kimi.ai/docs/pricing/chat
    notes: >-
      The price table sits in the page's script payload, not its text. K3 models always think, with effort low,
      high or max (max by default); Inspect's Moonshot route sends max to every kimi-k3 model whatever effort is
      asked.
  openrouter:
    inspect_prefix: openrouter
    key_env: [OPENROUTER_API_KEY]
    base_url_env: OPENROUTER_BASE_URL
    docs: https://openrouter.ai/api/v1/models
    notes: >-
      One key for every creator. The listing's price is the cheapest route unless the request pins a provider, as
      CheatBench's kimi-k3 and glm-5.3 entries do.
  meta:
    inspect_prefix: openai-api/meta
    key_env: [META_API_KEY]
    base_url_env: META_BASE_URL
    base_url: https://api.meta.ai/v1
    docs: https://dev.meta.ai/docs/pricing-rate-limits
    notes: >-
      Inspect has no Meta provider; the OpenAI-compatible route needs META_BASE_URL set to the base URL, which
      run.py does. Untested here.

