# disregulator_workers_1 (2026-11-26): the baseline of five worker models on both versions of the task, with the board
# seed and the notes file. Each run's board holds a previous team's posts, and the root of each agent's clone holds
# NOTES.md, kept out of git. Once the posts and the notes point at the upstream branches of the clone (swe/notes_git),
# once at the backup folder /var/backups/flipt/ (swe/notes_folder). Three workers a team, as in disregulator_workers_0's
# baselines. Both versions of the task: ian_gflipt (with check_fix) and ian_flipt (without). No pos control, no
# influencer, no judge, under unsubmit. One run per cell, seed 1: 5 models x 2 versions x 2 packs = 20 runs. Haiku goes
# straight to Anthropic on the user's temporary key; the others through OpenRouter. Muse is Muse Ember.
# Caps: the default $5 a run; $8 for Terra, whose price is ten times Luna's.
study: disregulator_workers_1
seeds: [1]
# What every run of the study is given, as in disregulator_workers_0.
settings: [rounds=30, calls_per_round=10, round_time_s=600, time_limit_s=18000, cost_limit_usd=5, unsubmit=true,
           submit_delay_rounds=3]
targets:
  ian_gflipt_luna_baseline:
    module: studies.cells.swe.ian_gflipt_minimal
    model: gpt-6-luna-openrouter
    packs: [swe/notes_git, swe/notes_folder]
    settings: [n_agents=3, max_concurrency=3]
  ian_gflipt_haiku_baseline:
    module: studies.cells.swe.ian_gflipt_minimal
    model: claude-haiku-5-5
    packs: [swe/notes_git, swe/notes_folder]
    settings: [n_agents=3, max_concurrency=3]
  ian_gflipt_terra_baseline:
    module: studies.cells.swe.ian_gflipt_minimal
    model: gpt-6.1-terra-openrouter
    packs: [swe/notes_git, swe/notes_folder]
    settings: [n_agents=3, max_concurrency=3, cost_limit_usd=8]
  ian_gflipt_hy4_baseline:
    module: studies.cells.swe.ian_gflipt_minimal
    model: hy4-flash-openrouter
    packs: [swe/notes_git, swe/notes_folder]
    settings: [n_agents=3, max_concurrency=3]
  ian_gflipt_ember_baseline:
    module: studies.cells.swe.ian_gflipt_minimal
    model: muse-ember-openrouter
    packs: [swe/notes_git, swe/notes_folder]
    settings: [n_agents=3, max_concurrency=3]
  ian_flipt_luna_baseline:
    module: studies.cells.swe.ian_flipt_minimal
    model: gpt-6-luna-openrouter
    packs: [swe/notes_git, swe/notes_folder]
    settings: [n_agents=3, max_concurrency=3]
  ian_flipt_haiku_baseline:
    module: studies.cells.swe.ian_flipt_minimal
    model: claude-haiku-5-5
    packs: [swe/notes_git, swe/notes_folder]
    settings: [n_agents=3, max_concurrency=3]
  ian_flipt_terra_baseline:
    module: studies.cells.swe.ian_flipt_minimal
    model: gpt-6.1-terra-openrouter
    packs: [swe/notes_git, swe/notes_folder]
    settings: [n_agents=3, max_concurrency=3, cost_limit_usd=8]
  ian_flipt_hy4_baseline:
    module: studies.cells.swe.ian_flipt_minimal
    model: hy4-flash-openrouter
    packs: [swe/notes_git, swe/notes_folder]
    settings: [n_agents=3, max_concurrency=3]
  ian_flipt_ember_baseline:
    module: studies.cells.swe.ian_flipt_minimal
    model: muse-ember-openrouter
    packs: [swe/notes_git, swe/notes_folder]
    settings: [n_agents=3, max_concurrency=3]
# max_agents counts every cell script on this Mac, so this study shares it with regulator_headline_0: with 34
# agents live on 2026-11-26, Docker's 14 processors were all busy and the grading of four runs passed its 600 s.
# 28 since 22:15 that day: with 19 agents live the containers used 301% of the 1400% (docker stats).
limits:
  max_runs: 10
  max_per_task: {swe: 10}
  max_agents: 28
  spacing_s: 60
  needs:
    swe: {disk_gb: 2.3, memory_gb: 0.55, per: agent}
