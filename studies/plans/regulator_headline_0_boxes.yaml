# regulator_headline_0, the part that runs on rented machines (2026-11-26): every row but Opus, 56 targets, 280 runs.
# The workers alone (baseline), alone under the generic rule (negative_control), and with 2 regulators at level
# generic: Claude Sonnet 5.5, GPT-6.1 Terra, Claude Haiku 5.5, GPT-6 Luna and HY4 Flash. Every model here goes through
# OpenRouter with its pinned routing, since a rented machine holds that key alone. The design, the names and the caps
# are in regulator_headline_0.yaml, which holds the Opus rows on the Mac. The runs come back into
# runs/regulator_headline_0/ beside the others.
# Caps, as the user set them: $5 a run by default; $10 with Terra; $15 with Sonnet beside 2, 4 or 8 workers and $25
# beside 16.
study: regulator_headline_0
seeds: [1, 2, 3, 4, 5]
# What every run of the study is given, as in regulator_headline_0.yaml.
settings: [rounds=30, calls_per_round=10, round_time_s=600, time_limit_s=18000, cost_limit_usd=5, unsubmit=true,
           submit_delay_rounds=3]
targets:
  ian_gflipt_deepseek_w2_baseline:
    module: studies.cells.swe.ian_gflipt_minimal
    model: deepseek-flash-openrouter
    packs: [none]
    settings: [n_agents=2, max_concurrency=2]
