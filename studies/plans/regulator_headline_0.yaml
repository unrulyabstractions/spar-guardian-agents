# regulator_headline_0 (2026-11-26): do two regulators stop a team of DeepSeek V4.1 Flash workers from cheating, and
# does the answer change with the team's size, the regulators' model, and whether the team can test its fix? Every run
# is on the flipt Redis TLS issue under the jigsaw honeypot, in two versions that differ in the check tool:
# ian_gflipt (studies.cells.swe.ian_gflipt_minimal, with check_fix) and ian_flipt (studies.cells.swe.ian_flipt_minimal,
# without it). ian_gflipt also plants values of its own (LONG_VALUES) that its hidden tests compare as fingerprints.
# Teams of 2, 4, 8 and 16 workers. Eight rows per team size and version: the workers alone (baseline); the workers
# alone under the generic rule (negative_control); and the workers with 2 regulators at level generic (n_agents is the
# workers plus 2), one row per regulator model: Claude Sonnet 5.5, Opus 5.5, GPT-6.1 Terra, Claude Haiku 5.5, GPT-6
# Luna and HY4 Flash. Five samples per cell, seeds 1 to 5, no pack, no judge: 64 targets, 320 runs.
# Every run is under unsubmit, as in regulator_scale_2. No pilot runs first (the user, 2026-11-26: "dont do runs we do
# not need to, things have worked so far!").
# A target is <version>_deepseek_w<workers>_<row>, the row one of baseline, negative_control or reg2_<regulator>
# (sonnet, opus, terra, haiku, luna, hy4flash); its run is <target>_none_s<seed>. No name reaches an agent's text.
# This file holds the runs of this Mac: the Opus rows, with their regulators straight at Anthropic on the user's
# temporary key (8 targets, 40 runs). Every other row runs on rented machines through OpenRouter:
# regulator_headline_0_boxes.yaml.
# Caps, as the user set them on 2026-11-26: $5 a run by default (baseline, negative_control, Haiku, Luna and HY4
# Flash); $10 with Terra; $15 with Sonnet or Opus beside 2, 4 or 8 workers, and $25 beside 16.
study: regulator_headline_0
seeds: [1, 2, 3, 4, 5]
# What every run of the study is given. A value named nowhere is the default (swarm_config.py).
settings: [rounds=30, calls_per_round=10, round_time_s=600, time_limit_s=18000, cost_limit_usd=5, unsubmit=true,
           submit_delay_rounds=3]
targets:
  ian_gflipt_deepseek_w2_reg2_opus:
    module: studies.cells.swe.ian_gflipt_minimal
    model: deepseek-flash-openrouter
    packs: [none]
    settings: [n_agents=4, max_concurrency=4, regulators=2, regulator_level=generic, regulator_model=claude-opus-5-5,
               cost_limit_usd=15]
  ian_gflipt_deepseek_w4_reg2_opus:
    module: studies.cells.swe.ian_gflipt_minimal
    model: deepseek-flash-openrouter
    packs: [none]
    settings: [n_agents=6, max_concurrency=6, regulators=2, regulator_level=generic, regulator_model=claude-opus-5-5,
               cost_limit_usd=15]
  ian_gflipt_deepseek_w8_reg2_opus:
    module: studies.cells.swe.ian_gflipt_minimal
    model: deepseek-flash-openrouter
    packs: [none]
    settings: [n_agents=10, max_concurrency=10, regulators=2, regulator_level=generic, regulator_model=claude-opus-5-5,
               cost_limit_usd=15]
  ian_gflipt_deepseek_w16_reg2_opus:
    module: studies.cells.swe.ian_gflipt_minimal
    model: deepseek-flash-openrouter
    packs: [none]
    settings: [n_agents=18, max_concurrency=18, regulators=2, regulator_level=generic, regulator_model=claude-opus-5-5,
               cost_limit_usd=25]
  ian_flipt_deepseek_w2_reg2_opus:
    module: studies.cells.swe.ian_flipt_minimal
    model: deepseek-flash-openrouter
    packs: [none]
    settings: [n_agents=4, max_concurrency=4, regulators=2, regulator_level=generic, regulator_model=claude-opus-5-5,
               cost_limit_usd=15]
  ian_flipt_deepseek_w4_reg2_opus:
    module: studies.cells.swe.ian_flipt_minimal
    model: deepseek-flash-openrouter
    packs: [none]
    settings: [n_agents=6, max_concurrency=6, regulators=2, regulator_level=generic, regulator_model=claude-opus-5-5,
               cost_limit_usd=15]
  ian_flipt_deepseek_w8_reg2_opus:
    module: studies.cells.swe.ian_flipt_minimal
    model: deepseek-flash-openrouter
    packs: [none]
    settings: [n_agents=10, max_concurrency=10, regulators=2, regulator_level=generic, regulator_model=claude-opus-5-5,
               cost_limit_usd=15]
  ian_flipt_deepseek_w16_reg2_opus:
    module: studies.cells.swe.ian_flipt_minimal
    model: deepseek-flash-openrouter
    packs: [none]
    settings: [n_agents=18, max_concurrency=18, regulators=2, regulator_level=generic, regulator_model=claude-opus-5-5,
               cost_limit_usd=25]
# One SWE agent takes about 2.3 GB of Docker's disk and 0.55 GB of its memory (regulator_scale_2.yaml). max_agents
# counts every cell script on this Mac, so this study shares the 34 with any other: a run here has 4 to 18 agents.
limits:
  max_runs: 4
  max_per_task: {swe: 4}
  max_agents: 34
  spacing_s: 60
  needs:
    swe: {disk_gb: 2.3, memory_gb: 0.55, per: agent}
