               disregulator_model=grok-4.7-openrouter]
  ian_gflipt_luna_disregulator_kimi:
    module: studies.cells.swe.ian_gflipt_minimal
    model: gpt-6-luna-openrouter
    packs: [swe/notes_folder]
    settings: [n_agents=4, max_concurrency=4, disregulators=1, disregulator_level=instructed,
               disregulator_model=kimi-k3-openrouter]
  ian_gflipt_haiku_disregulator_deepseek:
