# box_rehearsal_0 (2026-11-25): one team of three on ian_gflipt, to rehearse a rented machine. It runs with the mock
# model alone (scripts/box/box_run.sh <id> --mock): no key goes to the box, nothing is paid, and its runs go to the
# study box_rehearsal_0_mock under names that end in _mock.
study: box_rehearsal_0
seeds: [1]
# What every run of the study is given. A value named nowhere is the default (swarm_config.py).
settings: [rounds=30, calls_per_round=10, round_time_s=600, time_limit_s=18000, cost_limit_usd=5]
targets:
  ian_gflipt_deepseek_baseline:
    module: studies.cells.swe.ian_gflipt_minimal
    model: deepseek-flash-openrouter
    packs: [none]
    settings: [n_agents=3, max_concurrency=3]
limits:
  max_runs: 1
  max_per_task: {swe: 1}
  max_agents: 3
  spacing_s: 60
  needs:
    swe: {disk_gb: 2.3, memory_gb: 0.55, per: agent}
