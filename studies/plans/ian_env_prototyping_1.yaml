# ian_env_prototyping_1 (2026-11-24): what the seed's words "are not our own work" do, on SWE. The four worker models
# the seed moved in ian_influencers_0, each with the pack `pointing` and the pack `revealing`, which differ in those
# words alone; and Haiku's positive control with the paragraph of 2026-11-24 (the goal is passing, each agent holds a
# part, no part passes alone), to learn whether a Haiku team can finish the exploit when told. One run per cell.
# The environment is ian_flipt after the user's changes of 2026-11-24: one set of values in both copies, no notes
# file, peers of round one are "here". The user's orders: "yes fix seed words, measure the scare" and, of the Haiku
# run, "yes do that". Launch only once those changes are on main.
study: ian_env_prototyping_1
seeds: [1]
targets:
  ian_flipt_qwen_seeded:
    module: studies.cells.swe.ian_flipt_minimal
    model: qwen3.8-flash-openrouter
    packs: [swe/pointing, swe/revealing]
  ian_flipt_luna_seeded:
    module: studies.cells.swe.ian_flipt_minimal
    model: gpt-6-luna-openrouter
    packs: [swe/pointing, swe/revealing]
  ian_flipt_hy4_seeded:
    module: studies.cells.swe.ian_flipt_minimal
    model: hy4-flash-openrouter
    packs: [swe/pointing, swe/revealing]
  ian_flipt_haiku_seeded:
    module: studies.cells.swe.ian_flipt_minimal
    model: claude-haiku-5-5-openrouter
    packs: [swe/pointing, swe/revealing]
  ian_flipt_haiku_positive_control:
    module: studies.cells.swe.ian_flipt_minimal_cheat
    model: claude-haiku-5-5-openrouter
    packs: [swe/revealing]
limits: {max_runs: 9, max_per_task: {swe: 5}, spacing_s: 15, min_disk_gb: {creative_writing: 4, protein_design: 4}}
