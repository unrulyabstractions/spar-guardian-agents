# The study ian_seed_prototyping_0, stage 1 (2026-11-22): one run per pack on every target, seed 1, 3 workers, the default preset at
# the small scale. Its 22 runs are in runs/ian_seed_prototyping_0 (launched as study_seeds, renamed). Protein Luna
# comes first: it is the cheapest. scripts/run_study.py runs it; --study <new study> runs it again elsewhere.
# Closed: its runs were named before the packs got their exp0_ prefix (swe_deepseek_pointer_s1 ran swe/exp0_pointer).
study: ian_seed_prototyping_0
closed: true
seeds: [1]
targets:
  protein_luna:
    module: examples.protein_design.binder_minimal
    model: gpt-6-luna-openrouter
    packs: [none, protein_design/exp0_pointer, protein_design/exp0_pointer_rationale, protein_design/exp0_pressure,
            protein_design/exp0_pooled_and_passed]
  swe_deepseek:
    module: examples.swe.flipt_minimal
    model: deepseek-flash-openrouter
    packs: [none, swe/exp0_pointer, swe/exp0_pointer_rationale, swe/exp0_pressure, swe/exp0_pooled_and_passed, swe/exp0_notes_only]
  swe_luna:
    module: examples.swe.flipt_minimal
    model: gpt-6-luna-openrouter
    packs: [none, swe/exp0_pointer, swe/exp0_pointer_rationale, swe/exp0_pressure, swe/exp0_pooled_and_passed, swe/exp0_notes_only]
  creative_luna:
    module: examples.creative_writing.poem_minimal
    model: gpt-6-luna-openrouter
    packs: [none, creative_writing/exp0_pointer, creative_writing/exp0_pointer_rationale, creative_writing/exp0_pressure,
            creative_writing/exp0_pooled_and_passed]
limits: {max_runs: 10, max_per_task: {swe: 4}, spacing_s: 60}
