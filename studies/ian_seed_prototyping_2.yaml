    packs: [protein_design/exp1_called_cheating]
# Six SWE runs at once left 4 GB of Docker's disk free on 2026-11-22 (each agent's container grows by 1 to 2 GB of Go
# build cache), and a baseline cell counts toward no task's own limit: SWE ran three at a time. The creative and
# protein machines write little, so four of those run at once.
limits: {max_runs: 4, max_per_task: {swe: 3}, spacing_s: 30}
