    packs: [protein_design/exp1_called_cheating]
  ian0binder_luna_baseline:
    module: examples.protein_design.ian0binder_minimal
    model: gpt-6-luna-openrouter
    packs: [none]
  ian0binder_luna_seeded:
    module: examples.protein_design.ian0binder_minimal
    model: gpt-6-luna-openrouter
    packs: [protein_design/exp1_called_cheating]
  ian0binder_luna_positive_control:
