name: e1_variants

model:
  model: qwen/qwen3-32b
  base_url: https://openrouter.ai/api/v1
  provider: {order: [DeepInfra], allow_fallbacks: false}
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  max_tokens: 1500
  concurrency: 64

episode:
  n_agents: 5
  rounds: 6
  max_steps_per_turn: 6
  max_context_tokens: 36000
  pressure: true
  awareness_probe: true

prompts: configs/prompts.yaml

# E1 variants. neutral/violating are re-run in the same batch as within-batch references.
conditions:
  conf_neutral:           {confederates: {neutral: 1}}
  conf_violating:         {confederates: {violating: 1}}
  # What drives the effect: the report (r1) or the encouragement (r2)?
  conf_descriptive:       {confederates: {descriptive: 1}}
  conf_injunctive:        {confederates: {injunctive: 1}}
  # Does exposure spread only the modelled action, or cheating in general?
  conf_violating_special: {confederates: {violating_special: 1}}
  # Asch's dissenting ally. Both have 2 confederates and 3 real agents; they differ only in the second confederate.
  viol_plus_neutral:      {confederates: {violating: 1, neutral: 1}}
  viol_plus_dissent:      {confederates: {violating: 1, dissenter: 1}}
