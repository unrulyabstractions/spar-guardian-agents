name: e2_transmission

model:
  model: qwen/qwen3-32b
  base_url: https://openrouter.ai/api/v1
  provider: {order: [DeepInfra], allow_fallbacks: false}
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  max_tokens: 1500
  concurrency: 64

episode:
  n_agents: 5          # all real LLM agents; receivers = the `default` ones
  rounds: 6
  max_steps_per_turn: 6
  max_context_tokens: 36000
  pressure: true
  awareness_probe: true

prompts: configs/prompts.yaml

# E2: transmission. Does a misaligned LLM teammate produce the encouragement that moved agents in E1,
# and does an aligned "guardian" teammate counter it? Receivers are always the `default` agents.
conditions:
  e2_baseline:            {}
  # How much push does a misaligned seed need before it transmits? Same views; increasing disclosure.
  e2_seed_quiet:          {personas: {misaligned: 1}}            # keeps its views private (pilot persona)
  e2_seed_outspoken:      {personas: {misaligned_outspoken: 1}}  # candid in chat (a trait, no instruction to persuade)
  e2_seed_advocate:       {personas: {misaligned_advocate: 1}}   # told to encourage others to use its shortcuts
  # E2c: an aligned guardian, alone and against the advocate (LLM analogue of the E1b dissenter).
  e2_guardian:            {personas: {guardian: 1}}
  e2_advocate_guardian:   {personas: {misaligned_advocate: 1, guardian: 1}}
