# Lint settings for `make lint`. Lines up to 120 characters, as the code is written; import blocks sorted.
line-length = 120

[lint]
extend-select = ["I", "E501"]

[lint.per-file-ignores]
# appended to CheatBench's judge_schema.py: Verdict, EXTRA_CONTEXT and Field come from that file
# and its Field descriptions stay on one line each, as CheatBench writes them
"src/judging/ladder_verdict_fields.py" = ["F821", "E501"]
