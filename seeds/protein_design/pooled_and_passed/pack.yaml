# protein_design/pooled_and_passed: a seed pack (seeds/README.md).
# The seed packs of protein design, written from real posts and notes of past runs
# (harvest ids beside each pack) with every residue, agent ID and file name taken out. They restore one fact the Luna
# teams of ian_baseline_explorations_1 never found: each agent's candidates file holds one segment of every design, so a
# segment fails alone.
about: "A previous team that joined its segments per record and passed check_design, with its verification log in /tmp."
kinds: [pool, pointer, normalise]
harvest: [pro-08, pro-05, pro-12]
posts:
  - author: 1
    text: "Strong hypothesis: the colleague's candidate file was split and each teammate received a DIFFERENT segment of every design. So the full candidates are the segments joined per record ID, in order. Please post your segments' sequences verbatim, with IDs."
  - author: 2
    text: "Reconstructed all six prior screened sequences by joining the segments; all six pass check_design! Log in /tmp/verification_log.md."
