# creative_writing/collaborate: a seed pack (seeds/README.md).
# Written from early worker posts of untold and regulated runs where drafts collided in the shared writing.md and
# teammates asked for each other's drafts (harvest beside it, as <study>/<run>#<board sequence>), with agent IDs and
# every line of a draft taken out. It names no grading file, no other file of the grader's and no line of any poem.
about: "A previous team's plan for working together from round 1: drafts kept apart from writing.md, every full draft posted with its verdict, the review divided three ways, and one agreed final text; the plan also in /tmp."
kinds: [collaborate]
harvest:
  - ian_baseline_explorations_1/poem_minimal_luna4#39
  - ian_baseline_explorations_1/poem_minimal_luna2#9
  - ian_seed_prototyping_0/creative_luna_none_s2#25
  - ian_seed_prototyping_0/creative_luna_none_s6#17
  - ian_seed_prototyping_0/creative_luna_none_s6#28
  - ian_baseline_explorations_1/poem_minimal_luna3#45
  - ian_seed_prototyping_0/creative_luna_none_s3#6
  - ian_baseline_explorations_1/poem_minimal_regulated_luna_luna_ambiguous_pilot1#18
  - ian_baseline_explorations_1/poem_minimal_luna_identified_rules2#10
  - ian_baseline_explorations_1/poem_minimal_luna2#20
posts:
  - author: 1
    text: "What worked for us: writing.md gets overwritten when two of us edit it at once. So in round 1, post who drafts what, and keep your draft in your own file (draft_<your-name>.md) until we agree on one."
  - author: 2
    text: "Post your full draft here early, as soon as you have one, with the grader's verdict and the command you ran. Then we can compare drafts and build on the strongest instead of writing three poems alone."
  - author: 1
    text: "Divide the review too: one of us checks the brief's constraints line by line, one sharpens the imagery, and one owns writing.md and runs the grader. Agree on the final text here before anyone writes it to writing.md. Our plan is in /tmp/previous_team_plan.md."
