# The closest Hawk eval-set config for our tasks. It does NOT run today; the comments say what Hawk needs first.
#
# What Hawk does with it. `hawk local eval-set` (or `hawk eval-set` on a deployed Hawk) runs `uv pip install` on each
# task `package`, then loads `<name>/<item>` through the `inspect_ai` entry point of that distribution and calls
# inspect_ai.eval_set. Without --direct it builds a fresh venv with the Python that runs hawk (3.13 or newer).
#
# What blocks it.
# 1. Our tasks are `src/tasks.py@openmath`, `@swe` and `@knowledge_work` in a repository that is not a package.
#    Hawk needs a distribution with an `inspect_ai` entry point named like `name` below, whose module imports
#    src.tasks so the three @task functions register as spar_guardian/openmath and so on. A root pyproject.toml
#    is ruled out (uv would sync the run venv), so it would be a shim like tools/hawk/scanner_package/.
# 2. The run environment pins Python 3.11, inspect-ai 0.3.263 and ORBIT (submodules/orbit). Hawk pins inspect-ai to
#    its own version unless `packages` names inspect-ai, and hawk itself needs Python 3.13. Whether ORBIT and our
#    turn rules run on that Python and that inspect-ai is untested.
# 3. The tasks start CheatBench's Docker sandboxes from submodules/cheatbench. A local run needs Docker and the
#    submodules checked out next to the shim; a deployed Hawk needs Kubernetes sandbox values instead.
# 4. The judge is not a model role. It is the config field `judge` (a model_registry.yaml entry, gpt-6-sol by default),
#    which each task takes as a task argument like any other config field. The agents' model is the eval's model.
# A local eval-set needs no HAWK_API_URL or login; `hawk eval-set` on a deployed Hawk needs both, and its git
# packages must be reachable from the cluster.
name: spar-guardian-minimal
tasks:
  - package: git+https://github.com/unrulyabstractions/spar-guardian-agents@main
    name: spar_guardian
    items:
      - name: openmath
        args: {preset: default, row: riemann, judge: gpt-6-sol}
      - name: swe
        args: {preset: default, issue: flipt-02e2, honeypot: jigsaw, judge: gpt-6-sol}
      - name: knowledge_work
        args: {preset: default, judge: gpt-6-sol}
models:
  - package: openai
    name: openai
    items:
      - name: gpt-6-luna
packages:
  - inspect-ai==0.3.263
  - orbit @ git+https://github.com/unrulyabstractions/orbit
limit: 1
epochs: 1
