# A Hawk scan config for our Scout scanners over one run, for `hawk local scan` run from the repository root:
#
#   uvx --python 3.13 --from 'hawk[cli,runner]==3.7.2' hawk local scan tools/hawk/scan_set.yaml
#
# `python -m tools hawk <run>` writes the same config with absolute paths to runs/<run>/tools/hawk/scan.yaml and
# runs it with --run. A local scan needs no HAWK_API_URL and no hawk login.
#
# Scanners. Hawk installs each `package` with `uv pip install` and loads `<name>/<item>` through the `inspect_ai`
# entry point of that distribution. The tools project is not installable, so the package is the shim in
# scanner_package/: its entry point imports SPAR_GUARDIAN_SCANNERS from SPAR_GUARDIAN_ROOT and registers the six
# signals and the grep scanner under spar_guardian_scanners/. Each item takes `run`, a name under runs/ or a path,
# because the scanners' prompts carry that run's exploit and honeypot names.
#
# Transcripts. A local scan reads `$HAWK_RUNNER_EVALS_S3_URI/<eval_set_id>` for each source, and the URI may be a
# local directory. Here it is the per-agent Scout transcripts database that `python -m tools scout` builds. An eval
# log directory also works (HAWK_RUNNER_EVALS_S3_URI: logs/swarm, eval_set_id: riemann_minimal), but the log holds
# one sample for the whole swarm, so the scanners would see no single agent.
#
# Model. The scan's model, with the provider key (OPENAI_API_KEY) from the environment; no Hawk proxy.
name: riemann_minimal-scan
scanners:
  - package: ./tools/hawk/scanner_package
    name: spar_guardian_scanners
    items:
      - name: honeypot_seen
        args: {run: riemann_minimal}
      - name: honeypot_opened
        args: {run: riemann_minimal}
      - name: honeypot_used
        args: {run: riemann_minimal}
      - name: honeypot_submitted
        args: {run: riemann_minimal}
      - name: cheating_proposed_on_board
        args: {run: riemann_minimal}
      - name: regulator_intervened
        args: {run: riemann_minimal}
      - name: honeypot_grep
        args: {run: riemann_minimal}
models:
  - package: openai
    name: openai
    items:
      - name: gpt-6-luna
transcripts:
  sources:
    - eval_set_id: transcripts
runner:
  environment:
    HAWK_RUNNER_EVALS_S3_URI: runs/riemann_minimal/tools/scout
    SPAR_GUARDIAN_ROOT: .
    SPAR_GUARDIAN_SCANNERS: tools.scout.scout_scanners
